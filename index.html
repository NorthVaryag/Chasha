<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Чаща — хроники 780 года</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1409;font-family:"Palatino Linotype",Palatino,Georgia,serif;color:#2b1d0e;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,12,5,.72);z-index:5;padding:12px}
.hidden{display:none!important}
.panel{background:radial-gradient(circle at 30% 20%,#f1e4bd,#d9c28a);border:4px double #6b4a1f;border-radius:6px;padding:22px 26px;max-width:660px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6);position:relative}
#menu .panel{padding-top:40px}
@media(max-width:420px){.panel{padding:18px 14px}#menu .panel{padding-top:40px}}
h1{margin:0;font-size:clamp(30px,9vw,56px);letter-spacing:clamp(2px,1.4vw,8px);color:#5a1f12;overflow-wrap:anywhere}
h2{margin:0 0 14px;font-size:28px;color:#5a1f12}
.sub{margin:4px 0 14px;font-size:18px;color:#6b4a1f;font-style:italic}
p{margin:8px 0;line-height:1.35}
.hint{font-size:14px;color:#6b4a1f}
.lang{position:absolute;top:8px;right:8px;min-width:44px;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1px;padding:5px 9px;background:transparent;color:#6b2a15;border:2px solid #6b4a1f;border-radius:3px;cursor:pointer;line-height:1}
.lang:hover{background:rgba(107,74,31,.15)}
button.big{margin-top:12px;font-family:inherit;font-size:22px;padding:12px 30px;background:#6b2a15;color:#f1e4bd;border:3px double #2b1d0e;border-radius:4px;cursor:pointer}
button.big:hover{background:#8a3a1c}
#cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{flex:1;min-width:150px;font-family:inherit;background:#f2e6c2;border:2px solid #6b4a1f;border-radius:4px;padding:12px 10px;cursor:pointer;color:#2b1d0e}
.card:hover{background:#fff3c9}
.card .ic{font-size:34px}
.card b{display:block;font-size:17px;margin:4px 0}
.card .lv{display:block;font-size:12px;color:#7a5a2a}
.card small{display:block;margin-top:6px;font-size:13px;line-height:1.25}
#banner{position:fixed;top:18%;left:0;right:0;text-align:center;font-size:30px;color:#f1e4bd;text-shadow:0 2px 8px #000;opacity:0;pointer-events:none;z-index:4;letter-spacing:2px;padding:0 10px}
#banner.show{animation:bn 3.2s ease forwards}
@keyframes bn{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="banner"></div>

<div id="menu" class="ov">
  <div class="panel">
    <button class="lang" id="lang" aria-label="Language / Язык">РУ</button>
    <h1 data-i="title">ЧАЩА</h1>
    <div class="sub" data-i="sub">Хроники 780 года</div>
    <p data-i="intro">Ты один в тёмном лесу раннего Средневековья.</p>
    <button class="big" id="start" data-i="start">Начать поход</button>
    <p class="hint" data-i="hint">Движение: WASD или стрелки, на телефоне палец по экрану.</p>
    <p class="hint" id="best"></p>
  </div>
</div>

<div id="levelup" class="ov hidden">
  <div class="panel">
    <h2 data-i="lvlTitle">Новый уровень</h2>
    <div id="cards"></div>
    <p class="hint" data-i="lvlHint">На компьютере можно нажать 1, 2 или 3.</p>
  </div>
</div>

<div id="end" class="ov hidden">
  <div class="panel">
    <h2 id="endTitle"></h2>
    <p id="endStats"></p>
    <button class="big" id="again" data-i="again">Ещё раз</button>
  </div>
</div>

<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
/* ---------- языки / languages ---------- */
const I18N={
ru:{
  page:'Чаща — хроники 780 года',title:'ЧАЩА',sub:'Хроники 780 года',
  intro:'Ты один в тёмном лесу раннего Средневековья. Волки, разбойники, кабаны и северные налётчики выходят из чащи. Твоё оружие бьёт само, а ты бегаешь, подбираешь опыт и выбираешь, чем сражаться дальше. Продержись до рассвета: 10 минут.',
  start:'Начать поход',hint:'Движение: WASD или стрелки, на телефоне палец по экрану.',
  best:'Лучший поход: ',lvlTitle:'Новый уровень',lvlHint:'На компьютере можно нажать 1, 2 или 3.',again:'Ещё раз',
  win:'Рассвет! Ты пережил ночь',lose:'Ты пал в чаще',
  stats:(tm,k,l,rec)=>'Время: '+tm+' · Убито: '+k+' · Уровень: '+l+(rec?' · Новый рекорд!':''),
  lv:'Ур.',cur:'Уровень ',nw:'Новое',
  ch:['Глава I · Тёмный лес, 780 год','Глава II · Туманные болота','Глава III · Осенний рубеж'],
  bossName:'Бурый Хозяин',b1:'Бурый Хозяин леса!',b2:'Хозяин вернулся...',
  up:{
    sword:['Меч',['Сам рубит врагов рядом','Шире и сильнее','Бьёт ещё и назад','Клинок длиннее, удар чаще','Мастерский клинок']],
    axe:['Метательный топор',['Метает топор в ближнего врага','+1 топор в броске','Больше урона, пробивает больше врагов','+1 топор в броске','Топоры бьют сильнее и чаще']],
    bow:['Охотничий лук',['Стрела в ближнего врага','+1 стрела','Урон выше','+1 стрела, пробивает врага','Быстрая стрельба']],
    torch:['Огненные факелы',['Два факела кружат вокруг тебя','+1 факел','+1 факел, шире круг','+1 факел','+1 факел, жар сильнее']],
    boots:['Походные сапоги','+12% к скорости бега'],
    heart:['Крепкое здоровье','+20 к максимуму здоровья и лечение'],
    pouch:['Кошель сборщика','+40% к радиусу подбора опыта'],
    might:['Сила','+15% к урону всего оружия'],
    drill:['Воинская выучка','Оружие перезаряжается на 8% быстрее'],
    herbs:['Целебные травы','Здоровье восстанавливается само'],
    mail:['Кольчуга','-12% к получаемому урону']
  }
},
en:{
  page:'Wildwood — Chronicles of AD 780',title:'WILDWOOD',sub:'Chronicles of AD 780',
  intro:'You are alone in the dark forest of the early Middle Ages. Wolves, bandits, boars and Northmen pour out of the thicket. Your weapons strike on their own while you run, gather experience and choose how to fight on. Survive until dawn: 10 minutes.',
  start:'Begin the journey',hint:'Move: WASD or arrow keys; on a phone, drag a finger on the screen.',
  best:'Best run: ',lvlTitle:'Level up',lvlHint:'On a computer you can press 1, 2 or 3.',again:'Play again',
  win:'Dawn breaks! You survived the night',lose:'You fell in the wildwood',
  stats:(tm,k,l,rec)=>'Time: '+tm+' · Kills: '+k+' · Level: '+l+(rec?' · New record!':''),
  lv:'Lv.',cur:'Level ',nw:'New',
  ch:['Chapter I · The Dark Forest, AD 780','Chapter II · Misty Marshes','Chapter III · Autumn Frontier'],
  bossName:'The Brown Lord',b1:'The Brown Lord of the Forest!',b2:'The Lord returns...',
  up:{
    sword:['Sword',['Strikes nearby enemies on its own','Wider and stronger','Also strikes behind you','Longer blade, faster swings','Master blade']],
    axe:['Throwing Axe',['Hurls an axe at the nearest enemy','+1 axe per throw','More damage, pierces more enemies','+1 axe per throw','Axes hit harder and more often']],
    bow:['Hunting Bow',['Shoots the nearest enemy','+1 arrow','Higher damage','+1 arrow, pierces an enemy','Rapid fire']],
    torch:['Flaming Torches',['Two torches orbit you','+1 torch','+1 torch, wider orbit','+1 torch','+1 torch, hotter flames']],
    boots:['Traveler\'s Boots','+12% movement speed'],
    heart:['Hardy Constitution','+20 max health and a heal'],
    pouch:['Gatherer\'s Pouch','+40% XP pickup radius'],
    might:['Strength','+15% damage for all weapons'],
    drill:['Battle Training','Weapons recharge 8% faster'],
    herbs:['Healing Herbs','Slowly regenerate health'],
    mail:['Chainmail','-12% damage taken']
  }
}
};
let LANG='ru';
try{
  const sv=localStorage.getItem('chasha_lang');
  LANG=(sv==='en'||sv==='ru')?sv:(String(navigator.language||'').toLowerCase().indexOf('ru')===0?'ru':'en');
}catch(_){}
const L=()=>I18N[LANG];
function applyLang(){
  const d=L();
  document.documentElement.lang=LANG;
  document.title=d.page;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=d[el.dataset.i];});
  $('lang').textContent=LANG==='ru'?'РУ':'EN';
  refreshBest();
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('chasha_lang',l);}catch(_){}
  applyLang();
}

const FONT='"Palatino Linotype",Palatino,Georgia,serif';

let W=800,H=600,DPR=1,S=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  S=Math.max(0.75,Math.min(W,H)/620);
}
addEventListener('resize',resize);resize();

function h2(x,y){
  let n=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;
  n=Math.imul(n^(n>>>13),1274126177);
  return((n^(n>>>16))>>>0)/4294967296;
}

/* ---------- данные ---------- */
const DEFS={
  wolf:{id:'wolf',hp:7,spd:100,dmg:6,r:10,xp:1,from:0},
  bandit:{id:'bandit',hp:16,spd:62,dmg:9,r:11,xp:2,from:40},
  boar:{id:'boar',hp:42,spd:72,dmg:14,r:15,xp:4,from:110},
  dane:{id:'dane',hp:75,spd:66,dmg:17,r:12,xp:6,from:200},
  bear:{id:'bear',hp:1400,spd:58,dmg:26,r:32,xp:40,from:99999,boss:true}
};
const UPG={
  sword:{kind:'w',icon:'⚔️',max:5},
  axe:{kind:'w',icon:'🪓',max:5},
  bow:{kind:'w',icon:'🏹',max:5},
  torch:{kind:'w',icon:'🔥',max:5},
  boots:{kind:'p',icon:'👢',max:5},
  heart:{kind:'p',icon:'❤️',max:5},
  pouch:{kind:'p',icon:'🧲',max:5},
  might:{kind:'p',icon:'💪',max:5},
  drill:{kind:'p',icon:'⏳',max:5},
  herbs:{kind:'p',icon:'🌿',max:5},
  mail:{kind:'p',icon:'🛡️',max:5}
};
const GC=[[88,108,60],[70,88,72],[124,104,58]];

/* ---------- состояние ---------- */
let state='menu',t=0,anim=0,chapter=-1,shake=0,nextId=1,flameAng=0,spawnAcc=0,choices=[];
let P,weapons,passives,wt,enemies,shots,gems,pickups,parts,texts,slashes,bossDone,cam={x:0,y:0};

function newGame(){
  P={x:0,y:0,hp:100,maxHp:100,spd:150,face:0,inv:0,xp:0,lvl:1,need:5,kills:0,magnet:70,dmgMul:1,cdMul:1,regen:0,armor:1,walk:0,r:10};
  weapons={sword:1};passives={};wt={sword:0,axe:0,bow:0};
  enemies=[];shots=[];gems=[];pickups=[];parts=[];texts=[];slashes=[];bossDone={};
  t=0;chapter=-1;shake=0;flameAng=0;spawnAcc=0;choices=[];
  cam.x=0;cam.y=0;
}
newGame();

/* ---------- ввод ---------- */
const keys={};
const joy={on:false,id:null,bx:0,by:0,x:0,y:0,dx:0,dy:0};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(state==='levelup'){const i=['Digit1','Digit2','Digit3'].indexOf(e.code);if(i>=0)pick(i);}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  joy.on=true;joy.id=e.pointerId;joy.bx=joy.x=e.clientX;joy.by=joy.y=e.clientY;joy.dx=joy.dy=0;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!joy.on||e.pointerId!==joy.id)return;
  const R=50;
  let dx=e.clientX-joy.bx,dy=e.clientY-joy.by;const m=Math.hypot(dx,dy);
  if(m>R){joy.bx+=dx/m*(m-R);joy.by+=dy/m*(m-R);dx=e.clientX-joy.bx;dy=e.clientY-joy.by;}
  joy.x=e.clientX;joy.y=e.clientY;joy.dx=dx/R;joy.dy=dy/R;
});
const joyEnd=e=>{if(e.pointerId===joy.id){joy.on=false;joy.dx=joy.dy=0;}};
cv.addEventListener('pointerup',joyEnd);
cv.addEventListener('pointercancel',joyEnd);
cv.addEventListener('contextmenu',e=>e.preventDefault());

function inputVec(){
  let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft)x--;
  if(keys.KeyD||keys.ArrowRight)x++;
  if(keys.KeyW||keys.ArrowUp)y--;
  if(keys.KeyS||keys.ArrowDown)y++;
  if(x||y){const m=Math.hypot(x,y);return[x/m,y/m];}
  if(joy.on){const m=Math.hypot(joy.dx,joy.dy);if(m>0.12)return m>1?[joy.dx/m,joy.dy/m]:[joy.dx,joy.dy];}
  return[0,0];
}

/* ---------- утилиты боя ---------- */
function nearest(maxD){
  let b=null,bd=maxD*maxD;
  for(const e of enemies){
    if(e.hp<=0)continue;
    const d=(e.x-P.x)**2+(e.y-P.y)**2;
    if(d<bd){bd=d;b=e;}
  }
  return b;
}
const angDiff=(a,b)=>Math.abs(((b-a+Math.PI*3)%TAU)-Math.PI);

function addXp(v){P.xp+=v;checkLevel();}
function checkLevel(){
  if(state!=='play')return;
  if(P.xp>=P.need){P.xp-=P.need;P.lvl++;P.need=Math.floor(P.need*1.22)+3;openLevelUp();}
}

function hit(e,dmg,ang,kb){
  if(e.hp<=0)return;
  const dm=dmg*P.dmgMul;
  e.hp-=dm;e.flash=0.08;
  const k=e.d.boss?kb*0.1:kb;
  e.kx+=Math.cos(ang)*k;e.ky+=Math.sin(ang)*k;
  if(texts.length<40)texts.push({x:e.x,y:e.y-e.r,txt:String(Math.max(1,Math.round(dm))),t:0.6,col:'#f4ecd8'});
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.hp=0;P.kills++;
  const g=()=>({x:e.x+rnd(-5,5),y:e.y+rnd(-5,5),v:e.d.xp});
  if(e.d.boss){
    for(let i=0;i<10;i++)gems.push({x:e.x+rnd(-34,34),y:e.y+rnd(-34,34),v:e.d.xp/2});
    for(let i=0;i<3;i++)pickups.push({x:e.x+rnd(-24,24),y:e.y+rnd(-24,24),heal:30});
    shake=10;
  }else if(gems.length>450)addXp(e.d.xp);
  else gems.push(g());
  if(!e.d.boss&&Math.random()<0.012)pickups.push({x:e.x,y:e.y,heal:25});
  for(let i=0;i<5;i++){const a=rnd(0,TAU),s=rnd(30,90);parts.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.4,c:'#5a1a12'});}
}

/* ---------- оружие ---------- */
function slash(a,range,arc,dmg){
  slashes.push({a,range,arc,t:0.18,max:0.18});
  for(const e of enemies){
    if(e.hp<=0)continue;
    const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy);
    if(d>range+e.r)continue;
    const ang=Math.atan2(dy,dx);
    if(d<e.r+14||angDiff(a,ang)<=arc/2)hit(e,dmg,ang,220);
  }
}
function fireWeapon(id,l){
  if(id==='sword'){
    const range=58+8*l,tg=nearest(range+25);
    if(!tg)return false;
    const a=Math.atan2(tg.y-P.y,tg.x-P.x),arc=1.5+0.15*l,dmg=12+6*l;
    slash(a,range,arc,dmg);
    if(l>=3)slash(a+Math.PI,range,arc,dmg);
    return true;
  }
  if(id==='axe'){
    const tg=nearest(420);if(!tg)return false;
    const n=1+Math.floor(l/2),base=Math.atan2(tg.y-P.y,tg.x-P.x);
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*0.3;
      shots.push({k:'axe',x:P.x,y:P.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,r:10,dmg:14+5*l,hits:2+l,life:1.5,rot:rnd(0,TAU),hit:new Set()});
    }
    return true;
  }
  if(id==='bow'){
    const tg=nearest(480);if(!tg)return false;
    const n=1+Math.floor(l/2),base=Math.atan2(tg.y-P.y,tg.x-P.x);
    for(let i=0;i<n;i++){
      const a=base+(i-(n-1)/2)*0.12;
      shots.push({k:'arrow',x:P.x,y:P.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,r:5,dmg:9+3*l,hits:1+(l>=4?1:0),life:1.1,rot:a,hit:new Set()});
    }
    return true;
  }
  return false;
}
const IV={sword:l=>1.0-0.08*(l-1),axe:l=>1.5-0.1*(l-1),bow:l=>1.3-0.1*(l-1)};

/* ---------- улучшения ---------- */
const lvlOf=id=>UPG[id].kind==='w'?(weapons[id]||0):(passives[id]||0);
function applyUpg(id){
  const u=UPG[id];
  if(u.kind==='w'){weapons[id]=(weapons[id]||0)+1;if(!(id in wt))wt[id]=0;return;}
  passives[id]=(passives[id]||0)+1;
  if(id==='boots')P.spd*=1.12;
  else if(id==='heart'){P.maxHp+=20;P.hp=Math.min(P.maxHp,P.hp+20);}
  else if(id==='pouch')P.magnet*=1.4;
  else if(id==='might')P.dmgMul+=0.15;
  else if(id==='drill')P.cdMul*=0.92;
  else if(id==='herbs')P.regen+=0.6;
  else if(id==='mail')P.armor*=0.88;
}
function openLevelUp(){
  const pool=Object.keys(UPG).filter(id=>lvlOf(id)<UPG[id].max);
  if(!pool.length){P.hp=P.maxHp;return;}
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  choices=pool.slice(0,3);
  if(P.lvl<7&&!choices.some(id=>UPG[id].kind==='w')){
    const wp=pool.filter(id=>UPG[id].kind==='w');
    if(wp.length)choices[choices.length-1]=wp[Math.floor(Math.random()*wp.length)];
  }
  const box=$('cards');box.innerHTML='';
  choices.forEach((id,i)=>{
    const u=UPG[id],cur=lvlOf(id),tx=L().up[id];
    const b=document.createElement('button');b.className='card';
    const d=Array.isArray(tx[1])?tx[1][cur]:tx[1];
    b.innerHTML='<div class="ic">'+u.icon+'</div><b>'+tx[0]+'</b><span class="lv">'+(cur?(L().cur+cur+' → '+(cur+1)):L().nw)+'</span><small>'+d+'</small>';
    b.onclick=()=>pick(i);
    box.appendChild(b);
  });
  $('levelup').classList.remove('hidden');
  state='levelup';
  joy.on=false;joy.dx=joy.dy=0;
}
function pick(i){
  if(state!=='levelup')return;
  const id=choices[i];if(!id)return;
  applyUpg(id);
  $('levelup').classList.add('hidden');
  state='play';
  P.inv=Math.max(P.inv,1);
  checkLevel();
}

/* ---------- старт / конец ---------- */
function showBanner(s){
  const b=$('banner');b.textContent=s;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
}
function bestTime(){try{return parseFloat(localStorage.getItem('chasha_best'))||0;}catch(_){return 0;}}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function refreshBest(){const b=bestTime();$('best').textContent=b?(L().best+fmt(b)):'';}
function startGame(){
  newGame();
  $('menu').classList.add('hidden');$('end').classList.add('hidden');$('levelup').classList.add('hidden');
  state='play';
}
function endGame(win){
  state=win?'win':'over';
  joy.on=false;joy.dx=joy.dy=0;
  const prev=bestTime();
  try{if(t>prev)localStorage.setItem('chasha_best',String(t));}catch(_){}
  $('endTitle').textContent=win?L().win:L().lose;
  $('endStats').textContent=L().stats(fmt(t),P.kills,P.lvl,t>prev);
  $('end').classList.remove('hidden');
}

/* ---------- спавн ---------- */
function spawnEnemy(d,hpMul){
  const half=Math.max(W,H)/(2*S)+70,a=rnd(0,TAU);
  const hp=d.hp*(hpMul||1)*(d.boss?1:1+t/200);
  enemies.push({id:nextId++,d,x:P.x+Math.cos(a)*half,y:P.y+Math.sin(a)*half,hp,mhp:hp,r:d.r,
    spd:d.spd*rnd(0.92,1.08),dmg:d.dmg*(1+t/400),flash:0,fcd:0,kx:0,ky:0,ang:0});
}
function pickDef(){
  const list=[],w=[];
  for(const k of ['wolf','bandit','boar','dane']){
    const d=DEFS[k];if(d.from>t)continue;
    list.push(d);w.push(k==='wolf'?Math.max(1,5-t/80):2);
  }
  let s=0;for(const x of w)s+=x;
  let r=Math.random()*s;
  for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i];}
  return list[0];
}

/* ---------- обновление ---------- */
function update(dt){
  t+=dt;anim+=dt;
  if(t>=600){endGame(true);return;}
  const ch=t<200?0:t<400?1:2;
  if(ch!==chapter){chapter=ch;showBanner(L().ch[ch]);}

  const[ix,iy]=inputVec();
  if(ix||iy){P.face=Math.atan2(iy,ix);P.walk+=dt*10;}
  P.x+=ix*P.spd*dt;P.y+=iy*P.spd*dt;
  P.inv=Math.max(0,P.inv-dt);
  if(P.regen)P.hp=Math.min(P.maxHp,P.hp+P.regen*dt);

  for(const id of ['sword','axe','bow']){
    const l=weapons[id];if(!l)continue;
    wt[id]-=dt;
    if(wt[id]<=0)wt[id]=fireWeapon(id,l)?Math.max(0.25,IV[id](l))*P.cdMul:0;
  }
  const tl=weapons.torch||0;
  flameAng+=dt*2.2;
  if(tl){
    const n=1+tl,rad=75+6*tl;
    for(let i=0;i<n;i++){
      const a=flameAng+i*TAU/n,fx=P.x+Math.cos(a)*rad,fy=P.y+Math.sin(a)*rad;
      for(const e of enemies){
        if(e.hp<=0||e.fcd>0)continue;
        const dx=e.x-fx,dy=e.y-fy;
        if(dx*dx+dy*dy<(12+e.r)**2){e.fcd=0.35;hit(e,5+2*tl,Math.atan2(dy,dx),120);}
      }
    }
  }

  spawnAcc+=Math.min(16,1.5+t/35)*dt;
  while(spawnAcc>=1){spawnAcc-=1;if(enemies.length<320)spawnEnemy(pickDef(),1);}
  if(t>=300&&!bossDone[0]){bossDone[0]=1;spawnEnemy(DEFS.bear,1);showBanner(L().b1);}
  if(t>=540&&!bossDone[1]){bossDone[1]=1;spawnEnemy(DEFS.bear,2.5);showBanner(L().b2);}

  // сетка для расталкивания врагов
  const grid=new Map(),CELL=40,key=(cx,cy)=>(Math.imul(cx,73856093)^Math.imul(cy,19349663));
  for(const e of enemies){
    if(e.hp<=0)continue;
    const k=key(Math.floor(e.x/CELL),Math.floor(e.y/CELL));
    let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(e);
  }
  const kd=Math.pow(0.003,dt);
  for(const e of enemies){
    if(e.hp<=0)continue;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    e.ang=Math.atan2(dy,dx);
    e.x+=(dx/d*e.spd+e.kx)*dt;e.y+=(dy/d*e.spd+e.ky)*dt;
    e.kx*=kd;e.ky*=kd;
    e.fcd-=dt;e.flash-=dt;
    if(d>950){const half=Math.max(W,H)/(2*S)+70,a=rnd(0,TAU);e.x=P.x+Math.cos(a)*half;e.y=P.y+Math.sin(a)*half;}
    const cx=Math.floor(e.x/CELL),cy=Math.floor(e.y/CELL);
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const arr=grid.get(key(cx+ox,cy+oy));if(!arr)continue;
      for(const o of arr){
        if(o.id<=e.id)continue;
        const sx=o.x-e.x,sy=o.y-e.y,sd=Math.hypot(sx,sy),min=e.r+o.r;
        if(sd<min&&sd>0.001){const p=(min-sd)*0.5/sd;e.x-=sx*p;e.y-=sy*p;o.x+=sx*p;o.y+=sy*p;}
      }
    }
    if(d<P.r+e.r&&P.inv<=0){
      const dm=Math.max(1,Math.round(e.dmg*P.armor));
      P.hp-=dm;P.inv=0.5;shake=6;
      texts.push({x:P.x,y:P.y-14,txt:'-'+dm,t:0.8,col:'#ff8a70'});
      if(P.hp<=0){P.hp=0;endGame(false);return;}
    }
  }

  for(const s of shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.k==='axe')s.rot+=dt*14;
    for(const e of enemies){
      if(e.hp<=0||s.hit.has(e))continue;
      const dx=e.x-s.x,dy=e.y-s.y;
      if(dx*dx+dy*dy<(s.r+e.r)**2){
        s.hit.add(e);hit(e,s.dmg,Math.atan2(s.vy,s.vx),140);
        s.hits--;if(s.hits<=0){s.life=0;break;}
      }
    }
  }
  shots=shots.filter(s=>s.life>0);
  enemies=enemies.filter(e=>e.hp>0);

  for(const g of gems){
    const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
    if(d<P.magnet||g.pull){g.pull=true;const sp=320;g.x+=dx/d*sp*dt;g.y+=dy/d*sp*dt;}
    if(d<14){g.got=true;addXp(g.v);}
  }
  gems=gems.filter(g=>!g.got);
  for(const p of pickups){
    if(Math.hypot(P.x-p.x,P.y-p.y)<20){p.got=true;P.hp=Math.min(P.maxHp,P.hp+p.heal);texts.push({x:P.x,y:P.y-14,txt:'+'+p.heal,t:0.8,col:'#9be37a'});}
  }
  pickups=pickups.filter(p=>!p.got);

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;}
  parts=parts.filter(p=>p.t>0);
  for(const x of texts){x.y-=26*dt;x.t-=dt;}
  texts=texts.filter(x=>x.t>0);
  for(const s of slashes)s.t-=dt;
  slashes=slashes.filter(s=>s.t>0);
  shake=Math.max(0,shake-dt*30);

  const k=1-Math.pow(0.0005,dt);
  cam.x+=(P.x-cam.x)*k;cam.y+=(P.y-cam.y)*k;
}

/* ---------- отрисовка ---------- */
const rgb=(c,m)=>'rgb('+((c[0]*m)|0)+','+((c[1]*m)|0)+','+((c[2]*m)|0)+')';
function groundCol(){
  const f=clamp(t/600,0,1)*2,i=Math.min(1,Math.floor(f)),k=f-i,a=GC[i],b=GC[i+1];
  return[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
}
function drawTree(px,py,c){
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(px+6,py+10,26,14,0,0,TAU);ctx.fill();
  ctx.fillStyle='#4a3420';ctx.beginPath();ctx.arc(px,py,5,0,TAU);ctx.fill();
  ctx.fillStyle=rgb(c,0.5);ctx.strokeStyle=rgb(c,0.3);ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(px,py-8,26,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle=rgb(c,0.62);ctx.beginPath();ctx.arc(px-5,py-12,19,0,TAU);ctx.fill();
  ctx.fillStyle=rgb(c,0.8);ctx.beginPath();ctx.arc(px-8,py-16,10,0,TAU);ctx.fill();
}
function drawGround(x0,y0,x1,y1,c){
  const PS=170;
  ctx.fillStyle='rgba(0,0,0,0.07)';
  for(let cy=Math.floor(y0/PS)-1;cy<=Math.floor(y1/PS)+1;cy++)for(let cx=Math.floor(x0/PS)-1;cx<=Math.floor(x1/PS)+1;cx++){
    const r=h2(cx+500,cy-500);
    if(r<0.45){ctx.beginPath();ctx.ellipse((cx+h2(cx,cy+7))*PS,(cy+h2(cx+3,cy))*PS,60+r*100,40+r*60,r*6,0,TAU);ctx.fill();}
  }
  const CS=56,dark=rgb(c,0.7),stone=rgb([120,118,108],1);
  for(let cy=Math.floor(y0/CS)-1;cy<=Math.floor(y1/CS)+1;cy++)for(let cx=Math.floor(x0/CS)-1;cx<=Math.floor(x1/CS)+1;cx++){
    const r=h2(cx,cy),px=(cx+h2(cx,cy+999))*CS,py=(cy+h2(cx+999,cy))*CS;
    if(r<0.07)drawTree(px,py,c);
    else if(r<0.2){
      ctx.strokeStyle=dark;ctx.lineWidth=1.5;ctx.beginPath();
      ctx.moveTo(px-4,py);ctx.lineTo(px-6,py-8);ctx.moveTo(px,py);ctx.lineTo(px,py-10);ctx.moveTo(px+4,py);ctx.lineTo(px+6,py-8);
      ctx.stroke();
    }else if(r<0.235){
      ctx.fillStyle=stone;ctx.beginPath();ctx.ellipse(px,py,8,5,0.3,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(px-2,py-1.5,4,2,0.3,0,TAU);ctx.fill();
    }else if(r<0.26){
      ctx.fillStyle=h2(cx,cy+5)<0.5?'#e8d98a':'#c9d6e8';
      for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(px+i*5-5,py+(i%2)*3,2,0,TAU);ctx.fill();}
    }
  }
}

function drawHero(){

  ctx.fillStyle='#8a2b1d';ctx.beginPath();ctx.ellipse(0,0,7,12,0,0,TAU);ctx.fill();                // туника

  ctx.strokeStyle='#3b2410';ctx.lineWidth=2;ctx.stroke();

  ctx.strokeStyle='#c8c8c0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(6,10);ctx.lineTo(18+bob*0.5,10);ctx.stroke(); // меч

  ctx.fillStyle='#9aa0a6';ctx.beginPath();ctx.arc(1,0,6.5,0,TAU);ctx.fill();                       // шлем
  ctx.strokeStyle='#4a4f55';ctx.lineWidth=1.5;ctx.stroke();

function drawWorld(){
  const c=groundCol();
  const sx=shake>0?rnd(-shake,shake):0,sy=shake>0?rnd(-shake,shake):0;
  ctx.fillStyle=rgb(c,1);ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+sx,H/2+sy);ctx.scale(S,S);ctx.translate(-cam.x,-cam.y);
  const hx=W/(2*S)+40,hy=H/(2*S)+40;
  drawGround(cam.x-hx,cam.y-hy,cam.x+hx,cam.y+hy,c);

  for(const g of gems){
    ctx.fillStyle=g.v<=1?'#6fbf5a':g.v<=5?'#4a90d9':'#e0b43a';

  }
  for(const e of enemies)drawEnemy(e);
  drawHero();
  for(const s of shots)drawShot(s);

  const tl=weapons.torch||0;
  if(tl){
    const n=1+tl,rad=75+6*tl;
    for(let i=0;i<n;i++){
      const a=flameAng+i*TAU/n,fx=P.x+Math.cos(a)*rad,fy=P.y+Math.sin(a)*rad,fk=1+0.15*Math.sin(anim*18+i);
      ctx.fillStyle='rgba(255,140,30,.3)';ctx.beginPath();ctx.arc(fx,fy,17*fk,0,TAU);ctx.fill();
      ctx.fillStyle='#ff9a2a';ctx.beginPath();ctx.arc(fx,fy,9*fk,0,TAU);ctx.fill();
      ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(fx,fy,4,0,TAU);ctx.fill();

    ctx.beginPath();ctx.arc(P.x,P.y,s.range*0.82,s.a-s.arc/2,s.a+s.arc/2);ctx.stroke();
  }
  for(const p of parts){ctx.globalAlpha=clamp(p.t/0.4,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  ctx.globalAlpha=1;
  ctx.font='bold 13px '+FONT;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';
  for(const x of texts){ctx.globalAlpha=clamp(x.t/0.4,0,1);ctx.strokeText(x.txt,x.x,x.y);ctx.fillStyle=x.col;ctx.fillText(x.txt,x.x,x.y);}
  ctx.globalAlpha=1;
  ctx.restore();
}

function txt(s,x,y,size,align,col){

  ctx.fillStyle=col||'#f1e4bd';ctx.fillText(s,x,y);
}
function hud(){

  ctx.fillStyle='#c9a64b';ctx.fillRect(0,0,W*clamp(P.xp/P.need,0,1),12);

  ctx.fillStyle='rgba(20,12,4,.65)';ctx.fillRect(10,22,bw,16);

  let row2='';
  for(const id in passives)row2+=UPG[id].icon+passives[id]+' ';
  if(row2)txt(row2,10,78,14,'left');
  txt(fmt(t),W/2,44,24,'center');
  txt('☠ '+P.kills,W-10,40,18,'right');
  const boss=enemies.find(e=>e.d.boss);
  if(boss){
    const bw2=Math.min(320,W*0.6),bx=W/2-bw2/2;
    ctx.fillStyle='rgba(20,12,4,.7)';ctx.fillRect(bx,58,bw2,12);
    ctx.fillStyle='#8a3a1c';ctx.fillRect(bx,58,bw2*clamp(boss.hp/boss.mhp,0,1),12);
    ctx.strokeStyle='#e6d5a8';ctx.lineWidth=2;ctx.strokeRect(bx,58,bw2,12);
    txt(L().bossName,W/2,84,13,'center');
  }
  if(joy.on){
    ctx.strokeStyle='rgba(240,230,200,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.bx,joy.by,50,0,TAU);ctx.stroke();
    ctx.fillStyle='rgba(240,230,200,.4)';ctx.beginPath();ctx.arc(joy.x,joy.y,20,0,TAU);ctx.fill();
  }
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawWorld();
  const na=0.32*Math.sin(Math.PI*clamp(t/600,0,1));
  if(na>0.01){ctx.fillStyle='rgba(10,18,40,'+na.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,6,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(state!=='menu')hud();
}

/* ---------- цикл ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(state==='play')update(dt);
  else anim+=dt;
  render();
}
requestAnimationFrame(frame);

window.__g={update,render,startGame,pick,setLang,I18N,UPG,openLevelUp,get state(){return state;},get P(){return P;},get enemies(){return enemies;},get t(){return t;},set t(v){t=v;},get weapons(){return weapons;},get choices(){return choices;}};
</script>
